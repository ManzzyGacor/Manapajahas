<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — JadiVaresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --ink: #171226; --ink-rise: #211936; --ink-line: #322549;
      --paper: #FBF8FF; --paper-dim: #A79BC4; --coral: #FF6B5B; --coral-deep: #E8503F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* BUG SEBELUMNYA: display:flex tanpa flex-direction berarti `row`,
         jadi .card dan .fine ("Kembali ke halaman utama") berjajar
         KE SAMPING. Kartunya jadi terjepit sempit di layar HP.
         Harus column supaya bertumpuk ke bawah. */
      min-height: 100vh;
      min-height: 100dvh; /* dvh ikut menyusut saat address bar HP muncul */
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--ink); color: var(--paper);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      padding: 24px 20px; position: relative;
      /* overflow:hidden sebelumnya memotong konten yang lebih tinggi dari
         layar TANPA bisa di-scroll. Cukup kunci arah horizontal saja. */
      overflow-x: hidden;
    }
    /* Satu titik cahaya lembut di belakang kartu, bukan gradient penuh layar */
    body::before {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: min(640px, 150vw); aspect-ratio: 1; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,107,91,0.16), transparent 65%);
      pointer-events: none; z-index: 0;
    }

    .card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: var(--ink-rise); border: 1px solid var(--ink-line);
      border-radius: 24px; padding: 38px 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      opacity: 0; transform: translateY(14px);
      animation: cardIn 0.5s ease forwards;
    }
    @keyframes cardIn { to { opacity: 1; transform: none; } }

    .brand { display: flex; align-items: center; gap: 11px; justify-content: center; margin-bottom: 28px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px; background: var(--coral);
      color: #fff; display: grid; place-items: center;
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px;
    }
    .brand-name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }

    h1 {
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700;
      font-size: 1.5rem; letter-spacing: -0.02em; text-align: center; margin-bottom: 9px;
    }
    .sub { color: var(--paper-dim); font-size: 0.9rem; text-align: center; line-height: 1.6; margin-bottom: 26px; }

    .tos {
      display: flex; align-items: flex-start; gap: 10px; text-align: left;
      font-size: 12.5px; color: var(--paper-dim); line-height: 1.55;
      margin-bottom: 24px; cursor: pointer; user-select: none;
    }
    .tos input {
      appearance: none; width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;
      border: 1.5px solid var(--ink-line); border-radius: 5px; cursor: pointer;
      position: relative; transition: border-color .15s, background-color .15s;
    }
    .tos input:checked { background: var(--coral); border-color: var(--coral); }
    .tos input:checked::after {
      content: ""; position: absolute; left: 5px; top: 1px;
      width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .tos a { color: var(--coral); text-decoration: none; }
    .tos a:hover { text-decoration: underline; }

    .gsi-wrap { display: flex; justify-content: center; min-height: 44px; width: 100%; overflow: hidden; }
    .gsi-wrap.disabled { opacity: 0.45; pointer-events: none; filter: grayscale(0.3); transition: opacity .2s, filter .2s; }

    .err {
      display: none; align-items: flex-start; gap: 9px;
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.28);
      color: #f9a8a8; font-size: 12.5px; line-height: 1.5;
      padding: 11px 13px; border-radius: 10px; margin-top: 18px;
    }

    .fine {
      position: relative; z-index: 1; margin-top: 22px; text-align: center;
      font-size: 12px; color: var(--paper-dim);
    }
    .fine a { color: var(--coral); text-decoration: none; font-weight: 600; }
    .fine a:hover { text-decoration: underline; }

    /* Layar HP sempit: rapatkan padding & kecilkan tipografi supaya
       seluruh kartu tetap muat tanpa perlu scroll. */
    @media (max-width: 420px) {
      body { padding: 20px 14px; }
      .card { padding: 30px 20px; border-radius: 20px; }
      h1 { font-size: 1.3rem; }
      .sub { font-size: 0.85rem; margin-bottom: 22px; }
      .brand { margin-bottom: 22px; }
      .tos { font-size: 12px; margin-bottom: 20px; }
    }

    /* Layar pendek (HP landscape): jangan paksa tengah, biarkan mengalir. */
    @media (max-height: 560px) {
      body { justify-content: flex-start; padding-top: 28px; padding-bottom: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">JV</span>
      <span class="brand-name">JadiVaresa</span>
    </div>

    <h1>Masuk ke akun kamu</h1>
    <p class="sub">Belum punya akun? Lanjutkan dengan Google, akun langsung dibuatkan otomatis.</p>

    <label class="tos" for="tos">
      <input type="checkbox" id="tos">
      <span>Saya setuju dengan <a href="#">Syarat &amp; Ketentuan</a> dan <a href="#">Kebijakan Privasi</a></span>
    </label>

    <div id="gsiButton" class="gsi-wrap disabled"></div>
    <p id="authError" class="err"></p>
  </div>

  <p class="fine">Kembali ke <a href="/">halaman utama</a></p>

  <script>
    // ID client Google yang sama dengan yang dipakai backend (lib/webserver.js)
    // untuk verifikasi token, jadi wajib identik.
    const GOOGLE_CLIENT_ID = "141130713954-udk7re4el6sugi4n39t9lus71rur76mg.apps.googleusercontent.com";

    const tosCheckbox = document.getElementById('tos');
    const gsiWrap = document.getElementById('gsiButton');
    const authError = document.getElementById('authError');

    function showError(msg) {
      authError.textContent = msg;
      authError.style.display = 'flex';
    }
    function hideError() { authError.style.display = 'none'; }

    // Tombol Google baru aktif setelah kotak centang dicentang — mencegah
    // klik lalu baru dikasih tahu "harus centang dulu" sesudahnya.
    tosCheckbox.addEventListener('change', () => {
      gsiWrap.classList.toggle('disabled', !tosCheckbox.checked);
      if (tosCheckbox.checked) hideError();
    });

    async function handleCredentialResponse(response) {
      hideError();
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const result = await res.json();

        if (!result.success) {
          showError(result.message || 'Autentikasi gagal, silakan coba lagi.');
          return;
        }

        // Kunci 'currentUser' ini wajib sama dengan yang dibaca app.js & admin.html.
        localStorage.setItem('currentUser', JSON.stringify(result.user));

        // Kalau datang lewat link undangan (?ref=KODE), langsung pakai
        // kodenya. Gagal di sini tidak boleh menghalangi login — user tetap
        // bisa memasukkannya manual di halaman Ajak Teman.
        const ref = new URLSearchParams(location.search).get('ref');
        if (ref) {
          try {
            await fetch('/api/referral/claim', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: result.user.id, code: ref })
            });
          } catch (e) { /* diabaikan, bukan penghalang login */ }
        }

        window.location.href = '/dashboard';
      } catch (err) {
        showError('Tidak bisa terhubung ke server. Periksa koneksi kamu dan coba lagi.');
      }
    }

    function renderGoogleButton() {
      gsiWrap.innerHTML = '';
      // Sebelumnya width dikunci 320px — di layar HP sempit itu lebih lebar
      // dari kartu login (max-width 400px dikurangi padding), jadi tombolnya
      // tumpah keluar kartu. Sekarang dihitung dari ruang yang benar-benar
      // tersedia, dengan batas atas 360px.
      const width = Math.min(360, Math.max(220, Math.floor(gsiWrap.offsetWidth)));
      google.accounts.id.renderButton(
        gsiWrap,
        { theme: 'filled_black', size: 'large', width, text: 'continue_with', shape: 'pill' }
      );
    }

    window.addEventListener('load', () => {
      if (!window.google || !window.google.accounts) {
        showError('Gagal memuat layanan Google. Coba refresh halaman ini.');
        return;
      }
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      renderGoogleButton();
    });

    // Render ulang saat orientasi/ukuran layar berubah supaya tombol tetap pas.
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.google?.accounts) renderGoogleButton();
      }, 250);
    });
  </script>
</body>
</html>
